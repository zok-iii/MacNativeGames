name: Compilar TOTK iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restaurar prod.keys
        run: |
          if [ -f "prod.keys" ]; then
            echo "prod.keys ya existe"
          elif [ -n "${{ secrets.PROD_KEYS }}" ]; then
            echo "${{ secrets.PROD_KEYS }}" > prod.keys
          fi

      - name: Instalar dependencias necesarias
        run: |
          brew install xcodegen

      - name: Compilar IPA para iPhone
        run: python3 build_app.py totk.xci -k prod.keys --platform ios -o TOTK_iOS.ipa

      - name: Subir IPA terminado
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TOTK_iOS
          path: TOTK_iOS.ipa
          retention-days: 7
